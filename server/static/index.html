<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record Live</title>
<style>
  :root { --fg: #1f2330; --muted: #8a8fa3; --line: #eceef3; --accent: #3b3f9e; --bg: #fff; --err: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 1; }
  .bar { max-width: 860px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: baseline; gap: 16px; }
  h1 { font-size: 17px; margin: 0; color: var(--accent); white-space: nowrap; }
  nav { display: flex; gap: 16px; font-size: 14px; white-space: nowrap; }
  nav a { color: var(--muted); text-decoration: none; } nav a.on { color: var(--accent); font-weight: 600; }
  .in-app nav { display: none; }
  .conv a { color: var(--accent); }
  #status { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  #status .bad { color: var(--err); }
  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 120px; }
  .row { display: grid; grid-template-columns: 80px 48px 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .play { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 4px 0 0; font-size: 12px; }
  .play:disabled { color: var(--muted); cursor: default; }
  .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
  .spk { color: var(--muted); font-size: 13px; padding-top: 1px; }
  .spk.me { color: var(--accent); font-weight: 600; }
  .spk.other { color: #9a6b1f; }
  .row.pending .text, .row.pending .spk { color: var(--muted); }
  .conv { color: var(--accent); font-size: 12px; padding: 12px 0 4px; border-top: 2px solid var(--accent); margin-top: 8px; }
  .text { word-break: break-word; }
  .err { color: var(--err); font-size: 13px; }
  .gap { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 0 4px; }
  #empty { color: var(--muted); text-align: center; padding: 60px 0; }
  #syslog { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); z-index: 2; }
  #syslog summary { max-width: 860px; margin: 0 auto; padding: 6px 16px; font-size: 12px; color: var(--muted); cursor: pointer; list-style: none; }
  #syslog summary::before { content: "▸ "; }
  #syslog[open] summary::before { content: "▾ "; }
  #events { max-width: 860px; margin: 0 auto; padding: 0 16px 8px; max-height: 32vh; overflow: auto; font: 12px/1.5 ui-monospace, monospace; }
  #events div { white-space: pre-wrap; word-break: break-all; }
  #events .state { color: var(--accent); }
  #events .warn { color: #9a6b1f; }
  #events .error { color: var(--err); }
  #jump { position: fixed; right: 24px; bottom: 64px; display: none; border: 1px solid var(--line); background: var(--bg);
          color: var(--accent); border-radius: 16px; padding: 6px 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  @media (max-width: 600px) {  /* phones: the app bar already carries a title; keep the status on one scrolling line */
    h1 { display: none; }
    nav { gap: 12px; font-size: 13px; }
    .bar { padding: 8px 12px; }
    #status { flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; gap: 12px; scrollbar-width: none; }
    main { padding: 4px 12px 110px; }
    .row { grid-template-columns: 70px 30px 1fr; gap: 8px; }
    .t, .spk { font-size: 12px; }
    .play { padding: 0 2px 0 0; }
  }
</style>
</head>
<body>
<header><div class="bar"><h1>Record Live</h1><nav><a href="/" class="on">实时字幕</a><a href="/conversations">对话</a></nav><div id="status">连接中…</div></div></header>
<main><div id="list"></div><div id="empty">今天还没有转写内容</div></main>
<button id="jump">回到最新</button>
<details id="syslog"><summary>系统日志 <span id="lastev"></span></summary><div id="events"></div></details>
<script>
if (/; wv\)/.test(navigator.userAgent)) document.documentElement.classList.add("in-app");  // Android WebView: the app has its own nav
const list = document.getElementById("list"), empty = document.getElementById("empty"), jump = document.getElementById("jump");
let last = null, follow = true;
const hhmmss = iso => iso.slice(11, 19);
const atBottom = () => window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
window.addEventListener("scroll", () => { follow = atBottom(); jump.style.display = follow ? "none" : "block"; });
jump.onclick = () => { window.scrollTo(0, document.body.scrollHeight); };

function add(s) {
  empty.style.display = "none";
  const start = new Date(s.start);
  if (last && start - last > 5 * 60 * 1000) {          // a quiet stretch: mark it so conversations separate
    const g = document.createElement("div"); g.className = "gap"; g.textContent = `— ${hhmmss(s.start).slice(0, 5)} —`; list.append(g);
  }
  last = new Date(s.end);
  const row = document.createElement("div"); row.className = "row" + (s.state === "final" ? "" : " pending"); row.id = "s" + s.id;
  row.dataset.start = s.start;
  row.innerHTML = `<div class="t"></div><div class="spk"></div><div class="text"></div>`;
  const btn = document.createElement("button"); btn.className = "play"; btn.textContent = "▶"; btn.title = "播放这一句";
  btn.onclick = () => play(btn, s);
  row.children[0].append(btn, hhmmss(s.start));
  setSpeaker(row, s.speaker, s.speaker_confidence);
  if (s.error) { row.children[2].className = "err"; row.children[2].textContent = "识别失败：" + s.error; }
  else row.children[2].textContent = s.text || "（空）";
  insert(row, s.start);
  if (follow) window.scrollTo(0, document.body.scrollHeight);
}

let current = null;
function play(btn, s) {
  if (current) { current.audio.pause(); current.btn.textContent = "▶"; if (current.btn === btn) { current = null; return; } }
  const audio = new Audio(`/api/audio?start=${encodeURIComponent(s.start)}&end=${encodeURIComponent(s.end)}`);
  current = { audio, btn }; btn.textContent = "■";
  audio.onended = () => { btn.textContent = "▶"; current = null; };
  audio.onerror = () => { btn.textContent = "×"; btn.disabled = true; btn.title = "这段录音取不出来"; current = null; };
  audio.play();
}

function setSpeaker(row, who, conf) {
  const c = row.children[1];
  c.textContent = who || "—";
  c.title = conf == null ? "" : `置信度 ${conf}`;
  c.className = "spk" + (who === "我" ? " me" : who && who !== "S?" ? " other" : "");
}

function insert(el, start) {                               // keep the list in time order
  const rows = list.querySelectorAll("[data-start]");
  for (const r of rows) if (r.dataset.start > start) { list.insertBefore(el, r); return; }
  list.append(el);
}

function finalize(m) {                                     // rows in [from, to) are replaced by the final ones, once
  for (const r of [...list.querySelectorAll("[data-start]")])
    if (m.from <= r.dataset.start && r.dataset.start < m.to) r.remove();
  m.rows.forEach(add);
}

function conversation(c) {
  const d = document.createElement("div"); d.className = "conv"; d.dataset.start = c.end;
  d.textContent = `对话 ${hhmmss(c.start)}–${hhmmss(c.end)} 结束 · 参与 ${(c.participants || []).join("、") || "—"} · ${c.sentences.length} 句 · `;
  const a = document.createElement("a"); a.href = "/c/" + c.id; a.id = "t" + c.id;
  a.textContent = c.summary && c.summary.status === "done" ? c.summary.title || "查看" : "摘要生成中…";
  d.append(a);
  insert(d, c.end);
}

const events = document.getElementById("events"), lastev = document.getElementById("lastev");
function event(e) {                                        // one line of the server's system log, newest at the bottom
  const d = document.createElement("div"); d.className = e.kind; d.textContent = `${e.at.slice(11, 19)}  ${e.text}`;
  events.append(d);
  while (events.children.length > 300) events.firstChild.remove();
  lastev.textContent = `· ${e.at.slice(11, 19)} ${e.text}`.slice(0, 90);
  if (document.getElementById("syslog").open) events.scrollTop = events.scrollHeight;
}

function status(m) {
  const behind = m.behind_s == null ? "—" : `${m.behind_s} 秒`;
  document.getElementById("status").innerHTML =
    `<span>${m.file || "等待录音"}</span><span class="${m.behind_s > 30 ? "bad" : ""}">落后 ${behind}</span><span class="${m.latency_s > 60 ? "bad" : ""}">上屏 ${m.latency_s ?? "—"} 秒</span>` +
    `<span>ASR ${m.asr_ms ?? "—"} ms</span><span class="${m.errors ? "bad" : ""}">失败 ${m.errors}</span><span>无人声 ${m.no_speech}</span>` +
    `<span class="${m.refine && m.refine.error ? "bad" : ""}">分离 ${m.refine ? (m.refine.error ? "失败" : m.refine.at.slice(11) + " " + (m.refine.ms / 1000).toFixed(0) + "s") : "等待"}</span>` +
    `<span class="${m.conversation ? "" : ""}">状态机 ${m.conversation ? "对话打开 " + m.conversation.start.slice(11, 19) + " · " + m.conversation.sentences + " 句" : "空闲，无打开的对话"}</span>` +
    `<span>${m.diarizer || ""} ${m.commit}</span>`;
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "sentence") add(m);
    else if (m.type === "final") finalize(m);
    else if (m.type === "conversation") conversation(m);
    else if (m.type === "summary") { const a = document.getElementById("t" + m.conversation); if (a) a.textContent = m.status === "done" ? m.title || "查看" : "摘要生成失败"; }
    else if (m.type === "event") event(m);
    else status(m);
  };
  ws.onclose = () => { document.getElementById("status").textContent = "连接断开，重连中…"; setTimeout(connect, 2000); };
}

fetch("/api/sentences").then(r => r.json()).then(rows => { rows.forEach(add); return fetch("/api/conversations"); })
  .then(r => r.json()).then(cs => { cs.filter(c => c.state === "closed").forEach(conversation); return fetch("/api/events"); })
  .then(r => r.json()).then(es => { es.forEach(event); connect(); });
</script>
</body>
</html>
