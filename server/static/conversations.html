<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话</title>
<style>
  :root { --fg: #1f2330; --muted: #8a8fa3; --line: #eceef3; --accent: #3b3f9e; --bg: #fff; --err: #b3261e; --soft: #f5f6fa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 1; }
  .bar { max-width: 860px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: baseline; gap: 20px; }
  h1 { font-size: 17px; margin: 0; color: var(--accent); white-space: nowrap; }
  nav { display: flex; gap: 16px; font-size: 14px; }
  nav a { color: var(--muted); } nav a.on { color: var(--accent); font-weight: 600; }
  .in-app header { display: none; }
  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 60px; }
  .day { font-size: 13px; color: var(--muted); margin: 20px 0 8px; }
  .card { display: block; color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  a.card:hover { border-color: var(--accent); }
  .card .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .title { font-weight: 600; margin: 2px 0; }
  .card .gist { font-size: 13px; color: #4a4f63; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.open { border-style: dashed; }
  .muted { color: var(--muted); } .bad { color: var(--err); }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--accent); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  #more { display: block; margin: 16px auto; }
  .find { position: sticky; background: var(--bg); padding: 10px 0 6px; z-index: 1; }
  header ~ main .find { top: 49px; } .in-app header ~ main .find { top: 0; }
  .find input { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; outline: none; }
  .find input:focus { border-color: var(--accent); }
  .tags { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-top: 8px; }
  .tag { flex: none; font-size: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 1px 10px; color: #4a4f63; background: var(--bg); cursor: pointer; }
  .tag.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card .tag { cursor: inherit; margin-right: 4px; padding: 0 8px; }
  .card .tagline { margin-top: 6px; }
  .kinds { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 8px; }
  .kinds button { border: 0; border-radius: 0; padding: 3px 14px; color: #4a4f63; }
  .kinds button.on { background: var(--accent); color: #fff; }
  .dict { font-size: 11px; color: #9a6b1f; border: 1px solid #ecd9b0; border-radius: 4px; padding: 0 4px; margin-right: 6px; white-space: nowrap; }
  #empty { color: var(--muted); text-align: center; padding: 60px 0; }
  h2 { font-size: 20px; margin: 16px 0 4px; }
  h3 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 22px 0 6px; }
  .summary { background: var(--soft); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  ul.items { list-style: none; padding: 0; margin: 0; }
  ul.items li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .who { color: var(--accent); font-size: 13px; margin-right: 6px; }
  .due { color: #9a6b1f; font-size: 12px; margin-left: 6px; }
  .rename { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; }
  .rename input { font: inherit; border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; width: 9em; outline: none; }
  .flash { margin-top: 10px; font-size: 13px; color: var(--accent); }
  .quote { font-size: 12px; color: var(--muted); }
  .at { font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .topic ul { margin: 2px 0 0; padding-left: 18px; font-size: 14px; }
  .row { display: grid; grid-template-columns: 80px 48px 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row.hit { background: #fff6d6; }
  .t, .spk { color: var(--muted); font-size: 13px; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .spk.me { color: var(--accent); font-weight: 600; } .spk.other { color: #9a6b1f; }
  .play { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 4px 0 0; font-size: 12px; }
  .text { word-break: break-word; }
  @media (max-width: 600px) {
    main { padding: 4px 12px 40px; }
    .row { grid-template-columns: 70px 30px 1fr; gap: 8px; }
    .t, .spk { font-size: 12px; }
  }
</style>
</head>
<body>
<header><div class="bar"><h1>Record Live</h1><nav><a href="/">实时字幕</a><a href="/conversations" class="on">对话</a></nav></div></header>
<main id="main"></main>
<script>
if (/; wv\)/.test(navigator.userAgent)) document.documentElement.classList.add("in-app");  // Android WebView: the app has its own nav
const main = document.getElementById("main");
const hhmm = iso => iso.slice(11, 16), hhmmss = iso => iso.slice(11, 19);
const mins = c => Math.max(1, Math.round((new Date(c.end) - new Date(c.start)) / 60000));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const convId = location.pathname.startsWith("/c/") ? decodeURIComponent(location.pathname.slice(3)) : null;

// ---- list: newest first, 30 at a time as the end scrolls into view; search words and one tag filter it
const params = new URLSearchParams(location.search);
let q = params.get("q") || "", tag = params.get("tag") || "", kind = params.get("kind") ?? "对话", before = "", lastDay = "", loading = false, done = false, results;
const more = el("button", null, "更早"); more.id = "more"; more.onclick = () => page();
new IntersectionObserver(es => es[0].isIntersecting && page()).observe(more);

async function list() {
  main.textContent = "";
  const find = el("div", "find"), input = el("input"); input.type = "search"; input.placeholder = "搜索标题、摘要、待办、原文"; input.value = q;
  let timer; input.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { q = input.value.trim(); restart(); }, 300); };
  const chips = el("div", "tags"), kinds = el("div", "kinds");
  for (const [k, label] of [["对话", "对话"], ["口述", "口述"], ["", "全部"]]) {  // 口述: mostly me dictating to a computer
    const b = el("button", k === kind ? "on" : "", label);
    b.onclick = () => { kind = k; kinds.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); restart(); };
    kinds.append(b);
  }
  find.append(input, kinds, chips); results = el("div");
  main.append(find, results, more);
  const counts = await (await fetch("/api/tags")).json();
  for (const [t, n] of Object.entries(counts).slice(0, 40)) {
    const b = el("button", "tag" + (t === tag ? " on" : ""), `${t} ${n}`);
    b.onclick = () => { tag = tag === t ? "" : t; chips.querySelectorAll(".tag").forEach(x => x.classList.toggle("on", x === b && tag)); restart(); };
    chips.append(b);
  }
  await restart();
}
async function restart() {
  const ps = new URLSearchParams({ ...(q && { q }), ...(tag && { tag }), ...(kind !== "对话" && { kind }) });
  history.replaceState(null, "", "/conversations" + (ps.size ? "?" + ps : ""));
  results.textContent = ""; before = ""; lastDay = ""; done = false;
  if (!q && !tag && kind === "对话") {  // the open conversation is not in the index yet
    const st = await (await fetch("/api/status")).json();
    if (st.conversation) results.append(card({ ...st.conversation, state: "open" }));
  }
  await page();
}
async function page() {
  if (loading || done) return;
  loading = true; more.textContent = "加载中…";
  const want = { q, tag, kind, before };
  const cs = await (await fetch("/api/search?" + new URLSearchParams({ q, tag, kind, before, limit: 30 }))).json();
  loading = false;
  if (want.q !== q || want.tag !== tag || want.kind !== kind || want.before !== before) return;  // a newer search started meanwhile
  for (const c of cs) {
    const d = c.start.slice(0, 10);
    if (d !== lastDay) { results.append(el("div", "day", d)); lastDay = d; }
    results.append(card(c));
  }
  done = cs.length < 30;
  if (cs.length) before = cs[cs.length - 1].start;
  if (!results.querySelector(".card")) results.append(el("div", null, q || tag ? "没有匹配的对话" : "还没有对话")).id = "empty";
  more.style.display = done ? "none" : "block"; more.textContent = "更早";
}
function card(c) {
  if (c.state === "open") {
    const d = el("div", "card open");
    d.append(el("div", "meta", `${hhmm(c.start)} 开始 · 进行中 · ${c.sentences} 句`), el("div", "title muted", "对话进行中，结束后生成摘要"));
    return d;
  }
  const a = el("a", "card"); a.href = "/c/" + c.id;
  const s = c.summary || {};
  const todos = (s.todos || []).length;
  a.append(el("div", "meta", `${c.kind === "口述" ? "口述 · " : ""}${hhmm(c.start)}–${hhmm(c.end)} · ${mins(c)} 分钟 · ${(c.participants || []).join("、") || "—"}${todos ? ` · ${todos} 条待办` : ""}`));
  a.append(el("div", "title" + (s.status === "failed" ? " bad" : s.status === "done" ? "" : " muted"),
    s.status === "done" ? (s.title || "（无标题）") : s.status === "failed" ? "摘要生成失败" : "摘要生成中…"));
  if (s.summary) a.append(el("div", "gist", s.summary));
  if ((s.tags || []).length) { const t = el("div", "tagline"); for (const x of s.tags) t.append(el("span", "tag", x)); a.append(t); }
  return a;
}

// ---- one conversation
async function detail() {
  const r = await fetch("/api/conversation/" + encodeURIComponent(convId));
  if (!r.ok) { main.textContent = "找不到这段对话"; return; }
  const c = await r.json();
  main.textContent = "";
  const back = el("a", null, "← 全部对话"); back.href = "/conversations"; main.append(back);
  const s = c.summary || {};
  main.append(el("h2", null, s.status === "done" ? (s.title || "（无标题）") : "对话 " + hhmm(c.start)));
  main.append(el("div", "muted", `${c.start.slice(0, 10)} ${hhmm(c.start)}–${hhmm(c.end)} · ${mins(c)} 分钟 · ${c.rows.length} 句 · ${(c.participants || []).join("、") || "—"}`));
  speakers(c);
  if (flash) { main.append(el("div", "flash", flash)); flash = ""; }
  if ((s.tags || []).length) {
    const t = el("div", "tags");
    for (const x of s.tags) { const a = el("a", "tag", x); a.href = "/conversations?tag=" + encodeURIComponent(x); t.append(a); }
    main.append(t);
  }
  if (s.status === "done") {
    if (s.summary) main.append(el("div", "summary", s.summary));
    if ((s.people || []).length) {
      main.append(el("h3", null, "各人要点"));
      const ul = el("ul", "items");
      for (const p of s.people) {
        const li = el("li"); li.append(el("span", "who", p.who));
        const pts = el("ul"); for (const x of p.points || []) pts.append(el("li", null, x)); li.append(pts); ul.append(li);
      }
      main.append(ul);
    }
    section("待办", s.todos, t => [el("span", "who", t.owner || "未知"), t.text, t.due ? el("span", "due", t.due) : "", at(t.at), quote(t.quote)]);
    section("决定", s.decisions, d => [d.text, at(d.at), quote(d.quote)]);
    if ((s.topics || []).length) {
      main.append(el("h3", null, "议题"));
      for (const t of s.topics) {
        const d = el("div", "topic"); d.append(el("b", null, t.title), at(t.at));
        const ul = el("ul"); for (const p of t.points || []) ul.append(el("li", null, p)); d.append(ul); main.append(d);
      }
    }
    main.append(el("div", "muted", s.model ? `由 ${s.model} 生成 · ${s.created_at.slice(5, 16).replace("T", " ")}` : "语音不足 60 秒，没有生成摘要"), regen());
  } else if (s.status === "failed") {
    main.append(el("div", "summary bad", "摘要生成失败：" + s.error), regen());
  } else main.append(el("div", "summary muted", "摘要生成中…"));
  main.append(el("h3", null, "原文"));
  for (const row of c.rows) main.append(line(row));
  if (location.hash) jumpTo(location.hash.slice(1));
}
// ---- renaming a speaker of this conversation (a prompt() dialog does not show in the Android WebView)
let flash = "";
function speakers(c) {
  const labels = (c.participants || []).filter(p => p !== "我" && p !== "S?");
  if (!labels.length) return;
  const box = el("div", "rename"); box.append(el("span", "muted", "改名："));
  for (const p of labels) { const b = el("button", "tag", p); b.onclick = () => editName(box, p); box.append(b); }
  main.append(box);
}
async function editName(box, frm) {
  const names = await (await fetch("/api/names")).json();
  box.textContent = "";
  const input = el("input"); input.placeholder = `${frm} 是谁`;
  const ok = el("button", null, "保存"), cancel = el("button", null, "取消"), msg = el("span", "bad");
  cancel.onclick = detail;
  ok.onclick = async () => {
    ok.disabled = true;
    const r = await fetch(`/api/conversation/${convId}/rename`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ from: frm, to: input.value }) });
    const j = await r.json();
    if (!r.ok) { ok.disabled = false; msg.textContent = j.detail; return; }
    flash = `${frm} → ${input.value.trim()}，改了 ${j.renamed} 句` + (j.voiceprints ? `，记住了 ${j.voiceprints} 句的声音，之后的对话会自动认出` : "（这段没有录音，不记声音）") + "；摘要重新生成中";
    detail();
  };
  input.onkeydown = e => { if (e.key === "Enter") ok.click(); };
  box.append(input, ok, cancel, msg);
  for (const n of names.slice(0, 12)) { const b = el("button", "tag", n); b.onclick = () => { input.value = n; }; box.append(b); }
  input.focus();
}
function section(title, items, parts) {
  if (!(items || []).length) return;
  main.append(el("h3", null, title));
  const ul = el("ul", "items");
  for (const x of items) { const li = el("li"); li.append(...parts(x)); ul.append(li); }
  main.append(ul);
}
const quote = q => q ? el("div", "quote", "「" + q + "」") : "";
function at(iso) {
  if (!iso) return "";
  const a = el("a", "at", hhmmss(iso)); a.href = "#" + iso; a.onclick = e => { e.preventDefault(); jumpTo(iso); }; return a;
}
function jumpTo(iso) {
  const r = document.querySelector(`[data-start="${CSS.escape(iso)}"]`); if (!r) return;
  document.querySelectorAll(".row.hit").forEach(x => x.classList.remove("hit"));
  r.classList.add("hit"); r.scrollIntoView({ block: "center" });
}
function regen() {
  const b = el("button", null, "重新生成"); b.style.marginLeft = "8px";
  b.onclick = async () => { b.disabled = true; await fetch(`/api/conversation/${convId}/summarize`, { method: "POST" }); detail(); };
  return b;
}
function line(s) {
  const row = el("div", "row"); row.dataset.start = s.start;
  const t = el("div", "t"), btn = el("button", "play", "▶"); btn.onclick = () => play(btn, s); t.append(btn, hhmmss(s.start));
  const who = s.speaker || "—";
  const text = el("div", "text");
  if (s.dictation) text.append(el("span", "dict", "口述→" + s.dictation));
  text.append(s.text || "（空）");
  row.append(t, el("div", "spk" + (who === "我" ? " me" : who !== "S?" && who !== "—" ? " other" : ""), who), text);
  return row;
}
let current = null;
function play(btn, s) {
  if (current) { current.audio.pause(); current.btn.textContent = "▶"; if (current.btn === btn) { current = null; return; } }
  const audio = new Audio(`/api/audio?start=${encodeURIComponent(s.start)}&end=${encodeURIComponent(s.end)}`);
  current = { audio, btn }; btn.textContent = "■";
  audio.onended = () => { btn.textContent = "▶"; current = null; };
  audio.onerror = () => { btn.textContent = "×"; btn.disabled = true; current = null; };
  audio.play();
}

function connect() {  // a summary or a closed conversation redraws the view
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (convId) { if (m.type === "summary" && m.conversation === convId) detail(); }
    else if ((m.type === "summary" || m.type === "conversation") && !q && !tag && window.scrollY < 200) restart();
  };
  ws.onclose = () => setTimeout(connect, 3000);
}
(convId ? detail() : list()).then(connect);
</script>
</body>
</html>
