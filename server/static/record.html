<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>live-record 录音</title>
<style>
  * { box-sizing: border-box; }
  body { font: 15px system-ui, sans-serif; margin: 0; color: #222; display: flex; flex-direction: column; height: 100vh; }
  #top { padding: 10px 16px 6px; border-bottom: 1px solid #eceef3; }
  #ctl { display: flex; gap: 10px; align-items: center; }
  button { font-size: 16px; padding: 10px 22px; border: 0; border-radius: 10px; background: #3b4cca; color: #fff; white-space: nowrap; }
  button.on { background: #c0392b; }
  input { font-size: 15px; padding: 8px 10px; flex: 1; min-width: 0; border: 1px solid #ccc; border-radius: 8px; }
  #stat { color: #555; font-size: 13px; margin: 6px 0 0; }
  details { font-size: 12px; color: #888; margin-top: 4px; }
  #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; color: #666; max-height: 30vh; overflow: auto; }
  iframe { flex: 1; border: 0; width: 100%; }
</style>
<div id="top">
  <div id="ctl"><input id="device" placeholder="设备名"><button id="btn">开始录音</button></div>
  <p id="stat">未开始</p>
  <details><summary>日志</summary><div id="log"></div></details>
</div>
<iframe src="/" title="字幕"></iframe>
<script>
const SLICE_MS = 20000, BPS = 32000;
const $ = id => document.getElementById(id);
$("device").value = localStorage.device || "phone";
let rec = null, sid, queue = [], sending = false, sent = 0, fails = 0;
const log = s => { $("log").textContent = (new Date().toLocaleTimeString() + " " + s + "\n" + $("log").textContent).slice(0, 4000); };
const status = () => { $("stat").textContent = rec ? `录音中 · 已传 ${sent} 块 · 待传 ${queue.length}` : "已停止"; };
async function post(url, body) {
  const r = await fetch(url, { method: "POST", body });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function drain() {  // a session's chunks are one webm stream: strictly in order, one at a time, retried until sent
  if (sending) return;
  sending = true;
  while (queue.length) {
    try { await post(`/api/record/${sid}`, queue[0]); queue.shift(); sent++; fails = 0; }
    catch (e) {
      fails++;
      log(`上传失败 ${e.message}，${Math.min(fails, 6) * 5} 秒后重试`);
      await new Promise(r => setTimeout(r, Math.min(fails, 6) * 5000));
    }
    status();
  }
  sending = false;
}
async function start() {
  localStorage.device = $("device").value;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const track = stream.getAudioTracks()[0];
  track.onended = () => log("麦克风被系统收回，录音停了");
  sid = (await post(`/api/record?device=${encodeURIComponent($("device").value)}`)).id;
  rec = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus", audioBitsPerSecond: BPS });
  rec.ondataavailable = e => { if (e.data.size) { queue.push(e.data); drain(); } };
  rec.onerror = e => log("recorder error " + (e.error || e));
  rec.start(SLICE_MS);
  sent = 0;
  log(`开始 ${sid} · ${track.label} · ${JSON.stringify(track.getSettings())}`);
  $("btn").textContent = "停止"; $("btn").className = "on"; status();
}
function stop() {
  rec.stop(); rec.stream.getTracks().forEach(t => t.stop()); rec = null;
  $("btn").textContent = "开始录音"; $("btn").className = ""; status(); log("停止");
}
$("btn").onclick = () => rec ? stop() : start().catch(e => log("启动失败 " + e));
document.addEventListener("visibilitychange", () => rec && log(`页面${document.hidden ? "进后台" : "回前台"}，已传 ${sent} 块`));
</script>
