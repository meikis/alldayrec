# Board self-test (src/main.c). USB serial console from the XIAO board definition.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_ADC=y
# The kernel and the radio run on the RC oscillator, so a dead 32.768 kHz crystal cannot hang the test; the crystal
# is tested on its own before the kernel starts
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# Boot on the LDOs: a board without the DCDC inductors still boots and reports; the dcdc command tries them
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n
CONFIG_USB_DEVICE_PRODUCT="LR selftest"
CONFIG_USB_DEVICE_MANUFACTURER="live-record"
CONFIG_CBPRINTF_FULL_INTEGRAL=y
CONFIG_MAIN_STACK_SIZE=2048
