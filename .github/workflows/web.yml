name: web
on:
  pull_request:  # only on PRs: main gets what a green PR ran
    paths: ['web/**', 'fixtures/**', '.github/workflows/web.yml']

concurrency:  # a new push to a PR cancels its run still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ${{ vars.LR_RUNNER == '' && 'ubuntu-24.04' || fromJSON(format('["self-hosted","{0}"]', vars.LR_RUNNER)) }}  # repo variable LR_RUNNER=lr-54: the self-hosted runner on .54
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, the job's only action: a runner downloads every action its job names, skipped or not
      - if: runner.environment == 'github-hosted'  # the image's Node is 22
        run: npm install -g pnpm@12.8.1  # package.json's devEngines
      - if: runner.environment == 'self-hosted'
        run: echo "$HOME/sdk/node/bin" >> "$GITHUB_PATH"  # .54: Node 22 and pnpm in ci-runner's home (apt's Node 18 cannot strip types)
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vue-tsc -b  # types
      - run: pnpm exec vp build    # the pages server/static/dist serves
      - run: for f in *.check.ts; do node --experimental-strip-types "$f" || exit 1; done  # recorderLog.ts, stream.ts
