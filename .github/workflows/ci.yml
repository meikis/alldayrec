name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:  # a new push to a PR replaces its run; each push to main runs, since each checks only what it changed
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  changes:  # one workflow, each check only when its part changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # the PR's file list
    outputs:
      server: ${{ steps.f.outputs.server }}
      app: ${{ steps.f.outputs.app }}
      firmware: ${{ steps.f.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7  # a push to main is diffed in git (a PR through the API)
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            server: ['server/**', '.github/workflows/ci.yml']
            app: ['app/**', '.github/workflows/ci.yml']
            firmware: ['firmware/devkit/**', 'firmware/selftest/**', '.github/workflows/ci.yml']

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:  # server.py refuses to import without these; the tests never reach the model or the services
      VAD_MODEL_DIR: unused
      LIVE_DATA: unused
      ASR_UPLOAD_BRIDGE_URL: unused
      ASR_SERVICE_URL: unused
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg  # the tests encode Opus and AAC pieces
      - uses: astral-sh/setup-uv@v10.2.0  # this action publishes no major-version tag
      - run: uv sync  # not --locked: uv.lock names a private mirror, uv re-resolves the same versions on PyPI
      - run: uv run --with pytest pytest -q

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5  # Dart 3.13.4, as pubspec.yaml asks; a new stable's lints come in by bumping this
          cache: true
      - run: flutter analyze
      # the iPhone's BLE record stream (Store.swift: mirror, 'T' dating, Ogg), event log (DeviceLog.swift), firmware update
      # checks (Dfu.swift) and listening (Listen.swift): Foundation only
      - run: swiftc -o /tmp/storecheck ios/Runner/Store.swift ios/Runner/DeviceLog.swift ios/Runner/Dfu.swift ios/Runner/Listen.swift ios/StoreCheck/main.swift && /tmp/storecheck

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.7.0  # Nordic's toolchain; the SDK's sources come from west below
    defaults:
      run:
        shell: bash  # the image loads the toolchain's environment in bash only
    env:
      NCS: /ncs
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'  # lr.sh reads the commit for the firmware revision
      - run: west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.7.0 $NCS && cd $NCS && west update --narrow -o=--depth=1
      - run: firmware/devkit/lr.sh build sdmod     # LR-X1 (XIAO nRF52840 Sense)
      - run: firmware/devkit/lr.sh build promicro  # LR-P1 (ProMicro nRF52840)
      - run: firmware/devkit/lr.sh build promicro-p3  # LR-P3: the switch and the power trail (lr_switch.c, lr_power.c)
      - run: python3 firmware/selftest/selftest.py build  # board self-test (ProMicro nRF52840)

  firmware-check:  # host checks of the firmware's logic: the record stream and its timing events (test/store_check.c)
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: firmware/devkit
    steps:
      - uses: actions/checkout@v7
      - run: |  # the Zephyr headers lr_store.c includes, empty: the check defines what it uses
          d=$(mktemp -d) && mkdir -p $d/zephyr/{bluetooth,fs,sys,logging,drivers,random}
          for h in bluetooth/conn bluetooth/gatt bluetooth/uuid fs/fs kernel logging/log sys/byteorder sys/ring_buffer drivers/sensor random/random drivers/sdhc drivers/gpio drivers/spi sys/crc; do touch $d/zephyr/$h.h; done
          cc -O1 -w -I$d -o $d/store_check test/store_check.c && $d/store_check
          cc -w -I$d -o $d/sdhc_check test/sdhc_check.c && $d/sdhc_check  # the SD card's SPI waits (src/sdhc_spi.c, #105)
          cc -o $d/led_check test/led_check.c && $d/led_check  # the one-LED boards' flash codes (src/led_code.h)
          cc -o $d/power_check test/power_check.c && $d/power_check  # when a low battery turns it off (src/lr_power.h)
          cc -o $d/switch_check test/switch_check.c && $d/switch_check  # LR-P3's switch debounce (src/lr_switch.h)
