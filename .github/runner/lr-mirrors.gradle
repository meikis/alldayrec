// Gradle init script of the self-hosted runner ci-runner, installed as
// /home/ci-runner/.cache/live-record-ci/apk-gradle/init.d/lr-mirrors.gradle (README: Runner 与工具链).
// .54 reaches Maven Central and the Gradle Plugin Portal through the LAN's transparent proxy, which drops a few % of
// TLS handshakes; Gradle does not retry a handshake failure and disables that repository for the rest of the build.
// Both come from Aliyun's direct mirrors instead. Google Maven (dl.google.com, a domestic CDN) is left alone.
System.setProperty('org.gradle.internal.plugins.portal.url.override', 'https://maven.aliyun.com/repository/gradle-plugin')
def central = ['https://repo.maven.apache.org/maven2', 'https://repo1.maven.org/maven2']
def mirror = { RepositoryHandler repos ->
    repos.withType(MavenArtifactRepository).configureEach { repo ->
        if (repo.url.toString().replaceFirst('/$', '') in central) repo.url = 'https://maven.aliyun.com/repository/central'
    }
}
beforeSettings { settings ->
    mirror(settings.buildscript.repositories)
    mirror(settings.pluginManagement.repositories)
    mirror(settings.dependencyResolutionManagement.repositories)
}
allprojects {
    mirror(buildscript.repositories)
    mirror(repositories)
}
